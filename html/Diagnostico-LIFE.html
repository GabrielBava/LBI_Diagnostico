,abertura:"Vamos falar de quem depende de você hoje: filhos e outras pessoas que você ajuda.",perguntas:["Em que fase escolar cada filho está?","Escola pública ou particular? Qual a mensalidade?","Você ajuda pais, enteados ou outras pessoas todo mês? Com quanto?"],atencao:["Escolha a categoria antes de preencher: pais e outros dependentes não têm escolaridade.","Mensalidades, auxílios e custos daqui entram sozinhos nas despesas fixas (bloco Dependentes).","A escolaridade define o custo educacional no cálculo de proteção (6.2)."]},despesas:{objetivo:"Revelar o custo de vida real, bloco por bloco, separando o que é fixo do que é variável.",abertura:"Não existe julgamento aqui. Vamos abrir bloco por bloco, começando pela casa, para entender para onde vai o dinheiro.",perguntas:["Casa: aluguel, condomínio, luz, água, internet, gás?","Mercado e alimentação do dia a dia?","Transporte (combustível, garagem, Uber/99, transporte público), saúde e profissionais (diarista, babá)?","Quais gastos anuais costumam ser esquecidos? (IPTU, seguros, viagens)","Qual gasto você cortaria primeiro? E qual nunca cortaria?"],atencao:["Gastos anuais: divida por 12.","Dependentes vêm de Sucessão; manutenção e IPVA dos veículos, do Patrimônio; anuidade dos cartões, da Renda.","Parcelas de financiamentos e dívidas não entram aqui: são lançadas em 8 · Financiamento e crédito e somadas no total.","Algo fora da lista? Use “+ Adicionar item” dentro do bloco.","Confira com as faturas do cartão: os gastos variáveis costumam ser subestimados."]},renda:{objetivo:"Conhecer todas as fontes de renda da família e o uso do cartão de crédito.",abertura:"Agora o lado de quem entra: sua renda, a do cônjuge, rendas extras e como você usa o cartão.",perguntas:["Qual a sua renda mensal? Sabe a bruta, a líquida ou as duas?","E a do cônjuge?","Tem renda extra, aluguéis, PLR ou ajuda de outra pessoa?","Quais cartões usa, qual o limite e quanto gasta por mês? Acumula milhas? Paga anuidade?","Declara o imposto de renda no modelo simplificado ou completo?"],atencao:["Se o cliente souber só a bruta (ou só a líquida), a outra é estimada pelas tabelas de INSS e IR.","Declaração completa abre espaço para PGBL (dedução de até 12% da renda bruta).","Bônus e PLR: use frequência Anual.","O gasto no cartão já está dentro das despesas: serve para avaliar limite e milhas."]},patrimonio:{objetivo:"Mapear imóveis e bens móveis, se estão quitados ou financiados, se estão protegidos e o que o cliente quer comprar.",abertura:"Vamos listar o que você já construiu: imóveis, carros e outros bens. E o que pretende conquistar.",perguntas:["Quais imóveis você tem? São para morar, renda ou investimento?","Estão quitados ou financiados? Se financiados, com qual instituição, qual a parcela e quanto falta?","Os imóveis e veículos têm seguro? Quanto gasta por ano com manutenção e IPVA?","Pensa em trocar ou ampliar algum bem? Qual o modelo de desejo?","Pretende comprar outro imóvel ou veículo? À vista, financiado ou por consórcio?"],atencao:["Bem financiado vira financiamento automaticamente (não lance de novo na seção 8).","Manutenção e IPVA entram em Despesas · Transporte.","Aquisições por financiamento ou consórcio viram oportunidade de consórcio na matriz.","Investimentos financeiros entram na etapa 4; a reserva, em Proteção.","Bens sem seguro viram oportunidade na matriz."]},dividas:{objetivo:"Entender os compromissos mensais: financiamentos, consórcios e dívidas.",abertura:"Dívida não é necessariamente ruim. O que importa é o custo e se ela cabe no seu mês.",perguntas:["Além dos bens já listados, tem outro financiamento?","Participa de consórcio? Quanto falta e já foi contemplado?","Tem dívidas de cartão, cheque especial, carnê, renegociação ou empréstimos?"],atencao:["Financiamentos de imóveis e veículos financiados já aparecem aqui, vindos do Patrimônio.","As parcelas daqui entram no total de despesas (não são digitadas em Despesas).","Cartão e cheque especial são as dívidas mais caras: prioridade no plano."]},projetos:{objetivo:"Registrar projetos em andamento ou planejados que vão exigir recursos.",abertura:"Tem algum projeto em mente? Uma reforma, um negócio, um investimento?",perguntas:["Qual o projeto e quanto deve custar?","Para quando?","Já começou ou ainda é uma ideia?"],atencao:["Projetos com data viram objetivos ou ações no plano."]},corporativo:{objetivo:"Entender a relação do cliente com empresas: participação, proteção e benefícios.",abertura:"Você tem empresa ou participação em alguma sociedade?",perguntas:["Qual o ramo e o faturamento médio?","Quantos sócios e funcionários?","A empresa tem seguro, plano de saúde e acordo de sócios?"],atencao:["Empresa sem seguro de sócio ou acordo societário é oportunidade de proteção."]},protecao:{objetivo:"Avaliar a reserva de emergência e o que protege a família se a renda faltar.",abertura:"Se a renda parasse amanhã, por quanto tempo você se manteria? E se você faltasse, o plano continuaria?",perguntas:["Tem reserva de emergência? Quanto e para quantos meses daria?","Tem seguro de vida individual? Qual o capital?","Tem seguro pela empresa? (termina com o vínculo)","Se ficasse impossibilitado de trabalhar, como pagaria as contas?","Tem plano de saúde e previdência privada? PGBL ou VGBL?"],atencao:["Compare os meses que o cliente imagina com os meses calculados pelas despesas.","PGBL só faz sentido com declaração completa do IR (6 · Renda)."]},aposentadoria:{objetivo:"Definir como o cliente quer viver no futuro: idade, estilo de vida e renda desejada.",abertura:"Vamos imaginar a sua aposentadoria. Com que idade e com qual estilo de vida você gostaria de viver?",perguntas:["Com que idade gostaria de ter a opção de parar de trabalhar?","Imagina uma vida mais simples, igual à de hoje ou mais confortável?","Quanto precisaria por mês, em valores de hoje?","Vai contar com INSS, aluguéis ou previdência?"],atencao:["Se o cliente não souber a renda desejada, o estilo de vida escolhido orienta o diagnóstico."]},investim
