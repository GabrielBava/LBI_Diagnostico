<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Diagnóstico LIFE | Plano financeiro</title>
    <meta name="description" content="Diagnóstico financeiro LIFE com prioridades, projeções e plano de ação personalizado." />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />
    <script>
      try {
        var t = localStorage.getItem("life-theme");
        if (t === "light") { document.documentElement.classList.add("light"); document.documentElement.style.colorScheme = "light"; }
        else { document.documentElement.classList.add("dark"); document.documentElement.style.colorScheme = "dark"; }
      } catch (e) { document.documentElement.classList.add("dark"); }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
